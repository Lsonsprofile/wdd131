<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="Product Review Form - WDD 131 Week 05">
    <meta name="author" content="Your Name">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="stylesheet" href="styles/form-small.css">
    <title>Product Review</title>
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header class="primary-header">
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" id="productReviewForm" class="revform">

        
            <fieldset>
                <label for="productName" class="s-label">Product Name <span class="required">*</span></label>
                <select name="productName" id="productName" required>
                    <option value="" disabled selected>Choose a Product...</option>
        
                </select>
            </fieldset>

        
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="star-rating">
                <div class="star-option">
                    <input type="radio" id="star1" name="rating" value="1" >
                    <label for="star1" title="1 star">★</label>
                </div>

                <div class="star-option">
                    <input type="radio" id="star2" name="rating" value="2" >
                    <label for="star2" title="2 stars">★★</label>
                </div>

                <div class="star-option">
                    <input type="radio" id="star3" name="rating" value="3" >
                    <label for="star3" title="3 stars">★★★</label>
                </div>

                <div class="star-option">
                    <input type="radio" id="star4" name="rating" value="4" >
                    <label for="star4" title="4 stars">★★★★</label>
                </div>

                <div class="star-option">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">★★★★★</label>
                </div>
                </div>
            </fieldset>

            
            <fieldset>
                <legend>Installation</legend>
                <label for="installDate" class="s-label">Date of Installation <span class="required">*</span></label>
                <input type="date" name="installDate" id="installDate" required>
            </fieldset>

            <fieldset>
                <legend>Which features did you find useful in the product?<small>(Check all that apply)</small></legend>
                <div class="checkboxes">
                    <label class="s-label"><input type="checkbox" name="features" value="Durability"> Durability</label>
                    <label class="s-label"><input type="checkbox" name="features" value="Ease of Use"> Ease of Use</label>
                    <label class="s-label"><input type="checkbox" name="features" value="Performance"> Performance</label>
                    <label class="s-label"><input type="checkbox" name="features" value="Design"> Design</label>
                </div>
            </fieldset>


            <fieldset>
                <legend>Your Feedback</legend>
                <label for="writtenReview" class="s-label">Written Review <small>(Optional)</small></label>
                <textarea name="writtenReview" id="writtenReview" rows="5" placeholder="Share your thoughts..."></textarea>

                <label for="userName" class="s-label">Your Name <small>(Optional)</small></label>
                <input type="text" name="userName" id="userName" placeholder="e.g., Lsonmanuel">
            </fieldset>

            <input type="submit" value="Post Review" class="submitBtn">
        </form>
    </main>

    <footer>
        &copy; <span id="currentYear"></span> &bull; Your Name &bull; All Rights Reserved
        <br>Last Updated: <span id="lastModified"></span>
    </footer>

</body>
</html>
