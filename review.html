<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Submitted – Thank You!</title>
  <link rel="stylesheet" href="styles/review.css">
  <script src="scripts/review.js" defer></script>
</head>
<body>
  <header class="primary-header">
    <h1>Thank You for Your Review!</h1>
  </header>

  <main>
  <section class="thanks">
    <h2>Submission Confirmation</h2>
    <p>Your product review has been successfully submitted.</p>
    
    <p class="counter-message">
      You have submitted <strong><span id="reviewCount">0</span> reviews</strong> so far.
    </p>
  </section>

  <section class="summary">
    <h2>Review Summary</h2>
    <div id="reviewDetails"></div>
  </section>

  <p style="text-align:center; margin-top: 2rem;">
    <a href="form.html" class="button">Submit Another Review</a>
  </p>
 </main>


  <footer>
    &copy;<span id="currentYear"></span> • Emmanuel Ndogo •<br>
    Last Updated: <span id="lastModified"></span>
  </footer>
</body>
</html>
